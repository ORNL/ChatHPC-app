[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-project-template"
dynamic = ["version"]
description = "Example python project which can be used as a template to create pure python projects with CI and documentation."
readme = "README.md"
requires-python = ">=3.8"
keywords = []
authors = [
  { name = "Aaron Young", email = "youngar@ornl.gov" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://code.ornl.gov/7ry/python-project-template#readme"
Homepage = "https://code.ornl.gov/7ry/python-project-template"
Issues = "https://code.ornl.gov/7ry/python-project-template/-/issues"
Source = "https://code.ornl.gov/7ry/python-project-template"

[project.scripts]
python-project-template-add1 = "python_project_template.add:main"

[tool.hatch.version]
path = "src/python_project_template/__about__.py"

[tool.hatch.env]
requires = [
  "hatch-mkdocs",
]

[tool.hatch.env.collectors.mkdocs.docs]
path = "mkdocs.yml"

[tool.hatch.envs.docs]

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
  "pre-commit",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
  "coverage xml -o coverage.xml",
]
cov-html = [
  "test-cov",
  "cov-report",
  "coverage html",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/python_project_template tests}"

[tool.coverage.run]
source_pkgs = ["python_project_template", "tests"]
branch = true
parallel = true
omit = [
  "src/python_project_template/__about__.py",
]

[tool.coverage.paths]
python_project_template = ["src/python_project_template", "*/python-project-template/src/python_project_template"]
tests = ["tests", "*/python-project-template/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise RuntimeError",
  "raise NotImplementedError",
  "pass",
  "raise ValueError",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.6.4"]
config-path = "ruff_defaults.toml"

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.ruff.lint]
extend-ignore = [
  "T201",   # `print` found
  "FBT001", # Boolean-typed positional argument in function definition
  "FBT002", # Boolean default positional argument in function definition
  "EM101",  # Raw string in Exception
  "TRY003", # Avoid long strings in Exception Class.
]
