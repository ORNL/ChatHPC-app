stages:
  - build
  - check
  - docs
  - test
  - check_coverage
  - deploy_coverage
  - deploy_docs

variables:
  HATCH_DATA_DIR: ".hatch"

before_script:
  - bash ./scripts/pyproject_ssh_to_https.sh
  - uv venv --seed
  - source .venv/bin/activate
  - uv sync

.zenith:
  tags: [ubuntu, zenith]

build-job:
  extends: [.zenith]
  stage: build
  script:
    - uv run python -c "import chathpc.app; print(chathpc.app.__doc__)"

check_format-job:
  extends: [.zenith]
  stage: check
  needs: []
  script:
    - (uv run hatch fmt | tee fmt.out && echo "lint_errors 0" > metrics.txt) || (cat fmt.out | grep -e 'Found .* errors' | sed 's/Found \(.*\) errors.*/lint_errors \1/' > metrics.txt)
    - cat metrics.txt
    - grep -q "lint_errors 0" metrics.txt
  artifacts:
    paths:
      - fmt.out
      - metrics.txt
    reports:
      metrics: metrics.txt
  allow_failure:
    exit_codes:
      - 1

check_type-job:
  extends: [.zenith]
  stage: check
  needs: []
  script:
    - uv run --all-groups ty check
  allow_failure:
    exit_codes:
      - 1

docs-job:
  tags: [devdocs]
  stage: docs
  needs: []
  script:
    - uv run hatch run docs:build
  artifacts:
    paths:
      - site

test-job:
  extends: [.zenith]
  stage: test
  needs: [build-job]
  script:
    - uv run hatch run test

test-scripts:
  extends: [.zenith]
  stage: test
  script:
    - scripts/test_commands.sh

coverage-job:
  extends: [.zenith]
  stage: check_coverage
  needs: [build-job]
  script:
    - uv run hatch run cov-html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - coverage_html_report
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.deploy_coverage_common:
  tags: [devdocs]
  stage: deploy_coverage
  needs: [coverage-job]
  script:
    - rsync -a --delete coverage_html_report/ ~/www/ChatHPC/ChatHPC-app/coverage

deploy_coverage-job:
  extends: .deploy_coverage_common
  only:
    - main@ChatHPC/ChatHPC-app

deploy_coverage_manual-job:
  extends: .deploy_coverage_common
  when: manual
  only:
    - branches@ChatHPC/ChatHPC-app

.deploy_docs_common:
  tags: [devdocs]
  stage: deploy_docs
  needs: [docs-job]
  script:
    - rsync -a --delete site/ ~/www/ChatHPC/ChatHPC-app

deploy_docs-job:
  extends: .deploy_docs_common
  only:
    - main@ChatHPC/ChatHPC-app

deploy_docs_manual-job:
  extends: .deploy_docs_common
  when: manual
  only:
    - branches@ChatHPC/ChatHPC-app
